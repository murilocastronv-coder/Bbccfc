name: Extract uploaded game ZIP
on:
  push:
    paths:
      - '.github/workflows/extract-zip.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract archive into folder
        run: |
          mkdir -p extracted-game
          unzip -oq 2dmu-main.zip -d extracted-game
          find extracted-game -type f | head -n 30
      - name: Commit extracted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extracted-game
          if git diff --cached --quiet; then
            echo 'No extracted changes to commit'
          else
            git commit -m 'Extract game archive into extracted-game/'
            git push
          fi
